// ============================================================
// 🚀 レンダリング
// ============================================================

function renderSchedule() {
  document.getElementById('lessonGrid').innerHTML = DAYS.map(d => `
    <div class="lesson-item">
      <div class="day">${d.day}</div>
      <div class="topic">📖 ${d.topic}</div>
      <div class="grammar">${d.grammar.map(g => `🔹 ${g}`).join(' ')}</div>
    </div>
  `).join('');
}

function renderGrammar() {
  document.getElementById('grammarContent').innerHTML = GRAMMAR_DATA.map(g => `
    <div class="grammar-box">
      <div class="title">${g.title}</div>
      <div class="formula">${g.formula}</div>
      ${g.examples.map(e => `<div class="example">📌 ${e}</div>`).join('')}
    </div>
  `).join('');
}

function renderQuiz() {
  const container = document.getElementById('quizContainer');
  container.innerHTML = QUIZ_DATA.map((q, idx) => `
    <div class="quiz-question" data-q="${idx}">
      <div class="q">${idx+1}. ${q.q}</div>
      <div class="options">
        ${q.options.map((opt, oi) => `
          <button data-opt="${oi}" onclick="checkAnswer(${idx}, ${oi})">${opt}</button>
        `).join('')}
      </div>
      <div class="feedback" id="feedback_${idx}"></div>
    </div>
  `).join('');
}

function renderIrregular() {
  const container = document.getElementById('irregularContainer');
  let html = `<div style="overflow-x:auto;"><table class="irregular-table">
    <thead><tr><th>原形</th><th>過去形</th><th>過去分詞</th><th>意味</th></tr></thead><tbody>`;
  IRREGULAR_VERBS.forEach(v => {
    html += `<tr><td><strong>${v.base}</strong></td><td>${v.past}</td><td>${v.pp}</td><td>${v.meaning}</td></tr>`;
  });
  html += `</tbody></table></div>`;
  container.innerHTML = html;
}

// ============================================================
// 🎯 回答チェック
// ============================================================

function checkAnswer(qIdx, selected) {
  const q = QUIZ_DATA[qIdx];
  const feedback = document.getElementById(`feedback_${qIdx}`);
  const buttons = document.querySelectorAll(`.quiz-question[data-q="${qIdx}"] .options button`);

  buttons.forEach(b => b.classList.remove('correct', 'wrong'));

  if (selected === q.correct) {
    buttons[selected].classList.add('correct');
    feedback.innerHTML = '✅ 正解！';
    feedback.style.color = '#2e7d32';
  } else {
    buttons[selected].classList.add('wrong');
    buttons[q.correct].classList.add('correct');
    feedback.innerHTML = `❌ 不正解。正解は「${q.options[q.correct]}」です。`;
    feedback.style.color = '#c62828';
  }
}

// ============================================================
// 🗂️ タブ切り替え
// ============================================================

function initTabs() {
  const tabs = document.querySelectorAll('#tabContainer .tab');
  const contents = {
    schedule: document.getElementById('tabSchedule'),
    grammar: document.getElementById('tabGrammar'),
    practice: document.getElementById('tabPractice'),
    irregular: document.getElementById('tabIrregular')
  };

  tabs.forEach(tab => {
    tab.addEventListener('click', function() {
      tabs.forEach(t => t.classList.remove('active'));
      this.classList.add('active');
      const target = this.dataset.tab;
      Object.keys(contents).forEach(key => {
        contents[key].classList.add('hide');
      });
      contents[target].classList.remove('hide');
    });
  });
}

// ============================================================
// 🔔 Toast
// ============================================================

function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._timer);
  el._timer = setTimeout(() => el.classList.remove('show'), 2500);
}

// ============================================================
// 🚀 初期化
// ============================================================

document.addEventListener('DOMContentLoaded', function() {
  renderSchedule();
  renderGrammar();
  renderQuiz();
  renderIrregular();
  initTabs();

  window.checkAnswer = checkAnswer;
  window.showToast = showToast;

  console.log('✅ 中2英語内部A 完全学習ページ 起動');
});
</script>
